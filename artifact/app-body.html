<!-- A primeira parada de Tab da página. Até chegar ao conteúdo, quem navega
     por teclado atravessa a marca, o cartão do cliente, o tema, cinco módulos
     e as abas do módulo — em TODA tela, de novo. Este atalho pula tudo isso
     num Enter. Ele fica escondido fora do foco, porque é inútil para quem usa
     o mouse e ocupa o canto superior esquerdo, que é da marca. -->
<a class="pular" href="#pagina">Pular para o conteúdo</a>
<div class="barra">
  <div class="linha1">
    <div class="marca"><b>Gestão de TI IARX</b><span>Financeiro · Projetos · Suporte de TI</span></div>
    <div class="cliente-atual" id="cliente-atual" hidden></div>
    <!-- Os seletores de Empresa, Filial e Base saíram daqui de propósito: eram
         um recorte GLOBAL, e mexer neles para conferir um número num módulo
         recortava o sistema inteiro — além de travar a tela de Integrações,
         que é do contratante e não de uma unidade. Cada tela tem agora a sua
         barra de filtros, logo abaixo do menu. -->
    <button type="button" class="bt-tema" id="bt-tema" aria-pressed="false"></button>
  </div>
  <div class="fichas" id="f-fichas" hidden style="padding:10px 20px 0"></div>
  <nav class="modulos" id="modulos" aria-label="Módulos"></nav>
  <nav class="abas" id="abas" aria-label="Telas do módulo"></nav>
</div>
<div class="filtros-tela" id="filtros-tela" hidden></div>
<!-- Quando a base foi atualizada pela última vez. Fica fora das telas porque
     vale para todas as do financeiro, e nenhuma delas precisa saber disso. -->
<div class="ultima-carga" id="ultima-carga" hidden></div>
<main class="pagina" id="pagina" tabindex="-1">
  <div class="carregando"><span class="giro"></span> Abrindo a base…</div>
</main>
