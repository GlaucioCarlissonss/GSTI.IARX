name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Testes e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Testes das regras de negócio
        run: npm test

      - name: Build do servidor e do front-end
        run: npm run build
