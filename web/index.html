<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GSTI.IARX — Gestão de TI</title>
    <!-- As MESMAS três vozes da versão hospedada: display para identificar,
         Plex Sans para ler, Plex Mono para o número alinhar. Até aqui este app
         usava só a fonte do sistema operacional, o que fazia as duas metades do
         GSTI parecerem dois produtos. Se a rede não entregar, a pilha de
         reserva em estilos.css mantém tudo legível. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <script>
      // Aplica o tema escolhido antes do primeiro pixel. Sem isto a tela abre
      // no tema do sistema e troca depois, e a piscada é visível.
      (function () {
        try {
          var t = localStorage.getItem('gsti-tema');
          if (t === 'claro' || t === 'escuro') document.documentElement.setAttribute('data-tema', t);
        } catch (e) { /* armazenamento bloqueado: fica no tema do sistema */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
